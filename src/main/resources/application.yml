server:
  port: 8083
  error:
    include-message: always
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/voc?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
  jpa:
    hibernate.ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
voc:
  bootstrap-admin-password: admin123   # DEV ONLY: resets user "admin" on every start. Remove in production.
  public-base-url: ${VOC_PUBLIC_URL:http://localhost:8081}   # where the survey web page is hosted (short link = base + /s/{token})
  cors-origins: "*"
  cti:
    poll-ms: 60000
